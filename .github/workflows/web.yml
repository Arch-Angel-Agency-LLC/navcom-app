name: navcom

on:
  push:
    paths: ['web/**', 'packages/**', 'data/**', 'docs/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'packages/**', 'data/**', 'docs/**']
  schedule:
    # Daily rebuild. This is load-bearing, not housekeeping.
    #
    # The site is static, so staleness is computed at build time and frozen into HTML. The
    # build applies a one-day safety margin (STALENESS_MARGIN_DAYS) so a field reads "call
    # first" a little early rather than a little late — but that margin is sized for a
    # daily cadence. If this job stops running, the margin stops covering the gap and the
    # published page starts overstating how fresh its data is.
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # One install for the whole workspace. The core holds the attestation model, the
      # wire format and the board; the daemon and the site are both consumers, and they
      # are checked against it together. Six wire-format divergences existed while these
      # lived in separate repositories — every one of them is a type error here.
      - run: npm ci

      - name: core
        run: npm run verify --workspace @navcom/core

      - name: watchtower
        run: npm run verify --workspace @navcom/watchtower

      # The seeder was absent from this file for its whole life, so its tests and -- more
      # importantly -- its audit of the committed directory never ran on a change. The
      # audit is the thing that catches an intake rule reaching a seeded row, which is the
      # single most harmful edit anybody could make to this repository.
      - name: seeder
        run: npm run verify --workspace @navcom/seeder

      - name: directory audit
        run: |
          for region in data/regions/*/; do
            slug=$(basename "$region")
            case "$slug" in _*) continue;; esac
            npm run seed --workspace @navcom/seeder -- audit "$slug"
          done

      # The browser the e2e tests drive. Chromium only -- WebKit would be closer to the
      # iPhone truth and doubles both install size and runtime, and no Safari-specific
      # failure has appeared yet to justify paying for it.
      - name: browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      # Type check, data check, build, unit tests, tests against the built HTML, tests in a
      # real browser, bundle budget. The budget fails the job rather than warning: the
      # device floor is a real target, and the data check fails it rather than letting an
      # invalid region reach a deploy.
      - name: navcom.app
        working-directory: web
        run: npm run verify

      - uses: actions/upload-artifact@v4
        with:
          name: navcom-app-build
          path: web/build
          retention-days: 7

      # Traces from a failed browser test. Only on failure, because a passing run has
      # nothing to look at and these are not small.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-traces
          path: web/test-results
          retention-days: 7

  # The daily rebuild has to actually redeploy, or it is not a rebuild.
  #
  # This job existed for weeks building an artifact that nothing consumed, while the live
  # site deployed on push only. So the "load-bearing" daily cadence that the staleness
  # margin is sized for was not happening at all: a week without a commit meant a week of
  # the published directory claiming its data was a day fresher than it was.
  #
  # Needs one repository secret, VERCEL_DEPLOY_HOOK — a Deploy Hook URL from the Vercel
  # project settings. Without it this step is skipped and says so, rather than passing
  # quietly and leaving the gap in place.
  redeploy:
    needs: verify
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: trigger the deploy
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK is not set, so the daily rebuild is NOT reaching the live site."
            echo "The published directory will keep computing staleness from whenever it was last pushed."
            echo "Add a Deploy Hook URL as a repository secret to close this."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Deploy triggered."

