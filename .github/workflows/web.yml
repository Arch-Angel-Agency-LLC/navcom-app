name: navcom

on:
  push:
    paths: ['web/**', 'packages/**', 'data/**', 'docs/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'packages/**', 'data/**', 'docs/**']
  schedule:
    # Daily rebuild. This is load-bearing, not housekeeping.
    #
    # The site is static, so staleness is computed at build time and frozen into HTML. The
    # build applies a one-day safety margin (STALENESS_MARGIN_DAYS) so a field reads "call
    # first" a little early rather than a little late — but that margin is sized for a
    # daily cadence. If this job stops running, the margin stops covering the gap and the
    # published page starts overstating how fresh its data is.
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # One install for the whole workspace. The core holds the attestation model, the
      # wire format and the board; the daemon and the site are both consumers, and they
      # are checked against it together. Six wire-format divergences existed while these
      # lived in separate repositories — every one of them is a type error here.
      - run: npm ci

      - name: core
        run: npm run verify --workspace @navcom/core

      - name: watchtower
        run: npm run verify --workspace @navcom/watchtower

      # Type check, data check, build, tests (unit + against the built HTML), bundle budget.
      # The budget fails the job rather than warning: the device floor is a real target,
      # and the data check fails it rather than letting an invalid region reach a deploy.
      - name: navcom.app
        working-directory: web
        run: npm run verify

      - uses: actions/upload-artifact@v4
        with:
          name: navcom-app-build
          path: web/build
          retention-days: 7

  # deploy:
  #   Deployment is not wired up because the host is not chosen yet. Whatever it is, it
  #   needs to run on the `schedule` trigger above and not only on push — a site that
  #   redeploys only when someone commits will drift out of date and go on claiming its
  #   data is fresh. See docs/delivery.md.
