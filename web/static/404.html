<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Not found · NavCom</title>
<meta name="description" content="That page does not exist. The resource directory is still here.">
<style>
/* Self-contained on purpose: a 404 must render even if nothing else on the site does.
   Tokens mirror src/lib/styles/tokens.css. Kept in sync by hand — it is nine values. */
:root{--ground:#f1f3f5;--surface:#fff;--ink:#12161c;--muted:#4e5661;--faint:#666f7c;
--line:#ccd2d9;--line-strong:#a8b0ba;--accent:#8a5406;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--ground:#0f1318;--surface:#161b22;--ink:#e7eaef;
--muted:#9aa3b0;--faint:#7d8794;--line:#272e38;--line-strong:#3c4450;--accent:#eaa645}}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header{border-bottom:1px solid var(--line-strong);background:var(--surface)}
.bar{max-width:48rem;margin:0 auto;padding:.85rem 1.1rem;display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap}
.brand{font-family:"Iowan Old Style",Charter,Georgia,serif;font-size:1.25rem;font-weight:600;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
nav{display:flex;gap:1.1rem;font-size:.92rem}
nav a{color:var(--muted);text-decoration:none}
nav a:hover{color:var(--accent);text-decoration:underline}
main{max-width:48rem;margin:0 auto;padding:2.5rem 1.1rem 5rem}
.eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin:0}
h1{font-family:"Iowan Old Style",Charter,Georgia,serif;font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.15;font-weight:600;margin:.5rem 0 1rem;text-wrap:balance}
p{margin:0 0 1rem;max-width:40rem;color:var(--muted)}
a{color:var(--accent);text-underline-offset:2px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.links{margin-top:1.5rem}
</style>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="/">NavCom</a>
  <nav><a href="/directory/">Directory</a><a href="/status/">Status</a><a href="/docs/">Docs</a></nav>
</div></header>
<main>
  <p class="eyebrow">404</p>
  <h1>That page does not exist</h1>
  <p>
    If you followed a link to a specific resource, the entry may have been removed — which
    is not the same as the place being closed. Check the directory.
  </p>
  <p class="links"><a href="/directory/">Open the directory</a> &middot; <a href="/">Start over</a></p>
</main>
</body>
</html>
